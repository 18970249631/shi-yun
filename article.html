    <style>
        .article-actions {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 40px;
            padding-top: 24px;
            border-top: 1px solid var(--color-border);
        }
        .reward-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid var(--color-primary, #c94043);
            background: transparent;
            color: var(--color-primary, #c94043);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .reward-btn:hover {
            background: var(--color-primary, #c94043);
            color: white;
        }
        .reward-btn svg {
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
        }
        
        /* 打赏模态框 */
        .reward-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        .reward-modal.active {
            display: flex;
        }
        .reward-modal-content {
            background: var(--color-bg, #faf8f5);
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            max-height: 90vh;
            overflow-y: auto;
        }
        .reward-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 24px;
            border-bottom: 1px solid var(--color-border, #e5e5e5);
        }
        .reward-modal-header h3 {
            font-family: var(--font-serif);
            font-size: 18px;
            color: var(--color-text, #1a1a1a);
        }
        .reward-close {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            background: var(--color-bg-light, #f5f5f5);
            color: var(--color-text-secondary, #666);
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .reward-close:hover {
            background: var(--color-primary, #c94043);
            color: white;
        }
        .reward-modal-body {
            padding: 24px;
        }
        .reward-amounts {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .reward-amount {
            flex: 1;
            min-width: 60px;
            padding: 12px 8px;
            border: 1px solid var(--color-border, #e5e5e5);
            border-radius: 8px;
            background: white;
            color: var(--color-text, #1a1a1a);
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .reward-amount:hover {
            border-color: var(--color-primary, #c94043);
            color: var(--color-primary, #c94043);
        }
        .reward-amount.active {
            background: var(--color-primary, #c94043);
            border-color: var(--color-primary, #c94043);
            color: white;
        }
        .reward-custom {
            margin-bottom: 24px;
        }
        .reward-custom label {
            display: block;
            font-size: 13px;
            color: var(--color-text-secondary, #666);
            margin-bottom: 8px;
        }
        .reward-custom-input {
            display: flex;
            align-items: center;
            border: 1px solid var(--color-border, #e5e5e5);
            border-radius: 8px;
            overflow: hidden;
        }
        .reward-custom-input span {
            padding: 12px 16px;
            background: var(--color-bg-light, #f5f5f5);
            color: var(--color-text-secondary, #666);
        }
        .reward-custom-input input {
            flex: 1;
            padding: 12px 16px;
            border: none;
            font-size: 16px;
            outline: none;
        }
        .reward-qrcodes {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .reward-qrcode {
            text-align: center;
        }
        .qrcode-title {
            font-size: 14px;
            color: var(--color-text, #1a1a1a);
            margin-bottom: 12px;
            font-weight: 500;
        }
        .qrcode-box {
            background: white;
            border: 1px solid var(--color-border, #e5e5e5);
            border-radius: 12px;
            padding: 12px;
            display: inline-block;
        }
        .qrcode-box img {
            width: 150px;
            height: 150px;
            display: block;
        }
        .reward-tip {
            text-align: center;
            font-size: 12px;
            color: var(--color-text-secondary, #999);
            margin-top: 20px;
        }

        /* 打赏模态框响应式 */
        @media (max-width: 575px) {
            .reward-modal-content {
                max-width: 100%;
                border-radius: 12px;
            }
            .reward-modal-header {
                padding: 16px 20px;
            }
            .reward-modal-header h3 {
                font-size: 16px;
            }
            .reward-modal-body {
                padding: 16px;
            }
