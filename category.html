<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="史韵 - 精品历史文学，按朝代分类浏览">
    <meta name="robots" content="index, follow">
    
    <title>分类页 | 史韵</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📜</text></svg>">
</head>
<body>
    <!-- 导航栏 -->
    <header class="header">
        <div class="container header-inner">
            <a href="index.html" class="logo" aria-label="史韵首页">
                <span class="logo-char">史</span>
                <span class="logo-text">韵</span>
            </a>
            <nav class="nav" role="navigation" aria-label="主导航">
                <a href="index.html" class="nav-link">首页</a>
                <a href="category.html?id=先秦" class="nav-link active">先秦</a>
                <a href="category.html?id=两汉" class="nav-link">两汉</a>
                <a href="category.html?id=魏晋" class="nav-link">魏晋</a>
                <a href="category.html?id=唐宋" class="nav-link">唐宋</a>
                <a href="category.html?id=明清" class="nav-link">明清</a>
            </nav>
            <div class="header-actions">
                <button class="search-btn" onclick="toggleSearch()" aria-label="搜索">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="M21 21l-4.35-4.35"></path>
                    </svg>
                </button>
                <button class="mobile-menu-btn" onclick="toggleMobileMenu()" aria-label="菜单" aria-expanded="false">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </div>
        <nav class="mobile-nav" id="mobileNav" aria-label="移动端导航">
            <a href="index.html">首页</a>
            <a href="category.html?id=先秦" class="active">先秦</a>
            <a href="category.html?id=两汉">两汉</a>
            <a href="category.html?id=魏晋">魏晋</a>
            <a href="category.html?id=唐宋">唐宋</a>
            <a href="category.html?id=明清">明清</a>
        </nav>
    </header>

    <!-- 搜索框 -->
    <div class="search-overlay" id="searchOverlay" role="dialog" aria-modal="true" aria-label="搜索">
        <div class="search-box">
            <input type="text" placeholder="搜索文章、作者、朝代..." id="searchInput" autocomplete="off">
            <button onclick="performSearch()">搜索</button>
        </div>
    </div>

    <!-- 分类头部 -->
    <div class="category-header" id="categoryHeader">
        <h1 id="categoryTitle">加载中...</h1>
        <p id="categoryDesc">正在加载分类内容...</p>
    </div>

    <!-- 分类内容 -->
    <section class="section">
        <div class="container">
            <div class="article-list" id="categoryArticles">
                <!-- 动态渲染 -->
            </div>
        </div>
    </section>

    <!-- 回到顶部 -->
    <button class="back-to-top" id="backToTop" onclick="scrollToTop()" aria-label="回到顶部">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 15l-6-6-6 6"/>
        </svg>
    </button>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-brand">
                    <span class="footer-logo">史韵</span>
                    <p>传承千年文脉，品味历史之美</p>
                </div>
                <div class="footer-links">
                    <div class="footer-col">
                        <h4>朝代分类</h4>
                        <a href="category.html?id=先秦">先秦诸子</a>
                        <a href="category.html?id=两汉">两汉风云</a>
                        <a href="category.html?id=魏晋">魏晋风骨</a>
                        <a href="category.html?id=唐宋">唐宋盛世</a>
                        <a href="category.html?id=明清">明清传奇</a>
                    </div>
                    <div class="footer-col">
                        <h4>关于</h4>
                        <a href="#">关于我们</a>
                        <a href="#">投稿须知</a>
                        <a href="#">联系主编</a>
                    </div>
                </div>
            </div>
            <div class="footer-bottom">
                <p>© 2026 史韵 | 精品历史文学平台 | 仅供学习交流</p>
            </div>
        </div>
    </footer>

    <script src="js/main.js"></script>
    <script src="js/category.js"></script>
</body>
</html>
